name: Generate Instagram dental concept
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_dental.py'
      - '.github/workflows/generate-dental.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate_dental.py
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/instagram/dental-care-concept.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generate dental Instagram concept image"
            git push
          fi
