name: Generate five Instagram business concepts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_five.py'
      - '.github/workflows/generate-five.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate_five.py
      - name: Commit generated Instagram artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/instagram/
          if ! git diff --cached --quiet; then
            git commit -m "Generate five WEBMANIACS Instagram portfolio concepts"
            git pull --rebase origin main
            git push
          fi
