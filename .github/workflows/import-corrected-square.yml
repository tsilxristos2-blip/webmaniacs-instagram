name: Import corrected square Instagram artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_corrected_square.py'
      - '.github/workflows/import-corrected-square.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import_corrected_square.py
      - name: Commit corrected 1080x1080 designs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/instagram/*-corrected-square.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add corrected full-bleed square Instagram images"
            git pull --rebase origin main
            git push
          fi
