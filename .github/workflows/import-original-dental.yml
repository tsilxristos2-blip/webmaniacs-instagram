name: Import original dental Instagram design
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_original_dental.py'
      - '.github/workflows/import-original-dental.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import_original_dental.py
      - name: Commit exact supplied design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/instagram/dental-care-original.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add correct original dental Instagram design"
            git pull --rebase origin main
            git push
          fi
